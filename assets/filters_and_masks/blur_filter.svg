<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120">
  <defs>
    <filter id="blurFilter">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
  </defs>

  <rect id="rectWithFilter"
        x="20" y="20" width="160" height="80"
        fill="red"
        filter="url(#blurFilter)" />
</svg>
