<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="40mm"
   height="40mm"
   viewBox="0 0 40 40"
   version="1.1"
   id="svg4"
   sodipodi:docname="grouped_gradients.svg"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview4"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:document-units="mm"
     inkscape:zoom="2.5907118"
     inkscape:cx="62.724075"
     inkscape:cy="63.496063"
     inkscape:window-width="2560"
     inkscape:window-height="1377"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg4" />
  <defs
     id="defs4">
    <linearGradient
       id="linearGradient6"
       inkscape:collect="always">
      <stop
         style="stop-color:#ff00ff;stop-opacity:1;"
         offset="0"
         id="stop6" />
      <stop
         style="stop-color:#00edff;stop-opacity:1;"
         offset="1"
         id="stop7" />
    </linearGradient>
    <!-- Base gradient in local gear coordinates -->
    <linearGradient
       id="gearGradientBase"
       x1="20"
       y1="20"
       x2="40"
       y2="40"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#77777d"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#b7b7b8"
         id="stop2" />
    </linearGradient>
    <!-- Gear gradient clone with a gradientTransform only -->
    <linearGradient
       id="gearGradient"
       xlink:href="#gearGradientBase"
       gradientUnits="userSpaceOnUse"
       gradientTransform="translate(-10,-10)" />
    <!-- Borehole gradient in local borehole coordinates -->
    <linearGradient
       id="boreholeGradientBase"
       x1="25"
       y1="25"
       x2="35"
       y2="35"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#7d7f85"
         id="stop3"
         style="stop-color:#540085;stop-opacity:1;" />
      <stop
         offset="1"
         stop-color="#cccbcc"
         id="stop4"
         style="stop-color:#ccb801;stop-opacity:1;" />
    </linearGradient>
    <!-- Borehole gradient clone with a different gradientTransform -->
    <linearGradient
       id="boreholeGradient"
       xlink:href="#boreholeGradientBase"
       gradientUnits="userSpaceOnUse"
       gradientTransform="translate(-10,-10)"
       x1="35.948936"
       y1="36.051064"
       x2="24.476595"
       y2="24.306383" />
    <linearGradient
       inkscape:collect="always"
       xlink:href="#linearGradient6"
       id="linearGradient7"
       x1="6.9446807"
       y1="5.0893617"
       x2="33.565956"
       y2="34.706383"
       gradientUnits="userSpaceOnUse" />
  </defs>
  <!-- Single shape transform you can treat as T_shape -->
  <g
     id="g7">
    <circle
       id="gear"
       cx="20"
       cy="20"
       r="20"
       fill="url(#gearGradient)"
       stroke="none"
       style="fill:url(#linearGradient7)" />
    <circle
       id="borehole"
       cx="20"
       cy="20"
       r="8"
       fill="url(#boreholeGradient)"
       stroke="none"
       style="fill:url(#boreholeGradient)" />
  </g>
</svg>
