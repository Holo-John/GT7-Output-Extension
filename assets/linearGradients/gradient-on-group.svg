<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="300"
   height="180"
   viewBox="0 0 300 180"
   version="1.1"
   id="svg2"
   sodipodi:docname="gradient-on-group.svg"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview2"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.6319444"
     inkscape:cx="155.33617"
     inkscape:cy="-2.1446808"
     inkscape:window-width="2560"
     inkscape:window-height="1377"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg2" />
  <defs
     id="defs2">
    <!-- A simple linear gradient -->
    <linearGradient
       id="grad1"
       x1="0"
       y1="0"
       x2="75.027771"
       y2="7.3127809"
       gradientUnits="userSpaceOnUse"
       gradientTransform="rotate(20)">
      <stop
         offset="0%"
         stop-color="steelblue"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="lightcyan"
         id="stop2" />
    </linearGradient>
  </defs>
  <!-- OUTER GROUP: gradient applied here -->
  <g
     id="outer"
     fill="url(#grad1)"
     transform="translate(20,20)"
     style="fill:url(#grad1)">
    <!-- Shape directly inside outer group -->
    <rect
       x="0"
       y="0"
       width="120"
       height="60"
       id="rect2" />
    <!-- NESTED GROUP: inherits gradient from outer group -->
    <g
       id="inner"
       transform="translate(150,0) scale(0.8)">
      <!-- Shape inside nested group -->
      <circle
         cx="40"
         cy="30"
         r="30"
         id="circle2" />
      <!-- Another nested group inside the nested group -->
      <g
         id="inner-inner"
         transform="translate(0,70) rotate(10)">
        <polygon
           points="0,0 80,0 40,40"
           id="polygon2" />
      </g>
    </g>
  </g>
</svg>
