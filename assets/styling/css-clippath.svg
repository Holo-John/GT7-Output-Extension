<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .fx { clip-path: url(#clip); filter: url(#blur); }
  </style>

  <rect class="fx" x="10" y="10" width="80" height="80" fill="green"/>
</svg>
