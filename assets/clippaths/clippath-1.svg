<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">

    <!-- Base geometry referenced by <use> -->
    <defs>
        <g id="star">
            <path d="M0,-20 L6,-6 L20,-6 L9,3 L13,17 L0,8 L-13,17 L-9,3 L-20,-6 L-6,-6 Z"
                fill="gold" />
        </g>

        <!-- ClipPath A: contains a transform AND a <use> -->
        <clipPath id="clipA" transform="rotate(30)" clipPathUnits="userSpaceOnUse">
            <use href="#star" transform="scale(1.5)" />
        </clipPath>

        <!-- ClipPath B: references ClipPath A -->
        <clipPath id="clipB" clipPathUnits="userSpaceOnUse">
            <g transform="translate(40,0)">
                <use href="#star" clip-path="url(#clipA)" transform="rotate(45)" />
            </g>
        </clipPath>

        <!-- ClipPath C: nested clipPath chain -->
        <clipPath id="clipC" clipPathUnits="userSpaceOnUse">
            <rect x="-50" y="-50" width="100" height="100" transform="skewX(20)" />
            <use href="#star" transform="translate(0,30)" clip-path="url(#clipB)" />
        </clipPath>

        <!-- ClipPath D: final composite -->
        <clipPath id="clipD" clipPathUnits="userSpaceOnUse">
            <circle cx="0" cy="0" r="60" transform="scale(1.2)" />
            <g clip-path="url(#clipC)" transform="rotate(-15)">
                <rect x="-80" y="-80" width="160" height="160" fill="none" />
            </g>
        </clipPath>
    </defs>

    <!-- Geometry using the complex clipPath -->
    <g transform="translate(200,200)">
        <rect x="-100" y="-100" width="200" height="200"
            fill="blue"
            clip-path="url(#clipD)"
            transform="rotate(10)" />
    </g>

</svg>