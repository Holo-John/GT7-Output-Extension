<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="400" height="400">

  <defs>
    <clipPath id="cpInner" clipPathUnits="objectBoundingBox">
      <rect x="0.0" y="0.0" width="1.0" height="1.0"/>
    </clipPath>

    <clipPath id="cp5" clipPathUnits="objectBoundingBox">
      <g transform="translate(0.1,0.1)">
        <g transform="scale(0.8)">
          <circle cx="0.5" cy="0.5" r="0.5" clip-path="url(#cpInner)"/>
        </g>
      </g>
    </clipPath>
  </defs>

  <rect id="shape5"
        x="20" y="20"
        width="360" height="360"
        clip-path="url(#cp5)"
        fill="orange"/>
</svg>
