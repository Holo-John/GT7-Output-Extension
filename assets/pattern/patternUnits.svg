<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="500"
    height="220"
    viewBox="0 0 500 220">

  <defs>

    <!-- Pattern content uses objectBoundingBox coordinates -->
    <pattern
		id="bboxPattern"
		patternUnits="objectBoundingBox"
		patternContentUnits="userSpaceOnUse"
		x="0"
		y="0"
		width="0.25"
		height="0.25">

    <path
        d="M 0 0 L 25 25"
        stroke="green"
        stroke-width="2"
        fill="none"/>

    <path
        d="M 25 0 L 0 25"
        stroke="yellow"
        stroke-width="2"
        fill="none"/>

</pattern>

  </defs>

  <!-- Small reference rectangle -->
  <rect
      x="20"
      y="20"
      width="100"
      height="100"
      fill="url(#bboxPattern)"
      stroke="black"/>

  <!-- Large rectangle using same pattern -->
  <rect
      x="180"
      y="20"
      width="250"
      height="150"
      fill="url(#bboxPattern)"
      stroke="black"/>

</svg>