<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="200"
   height="200"
   version="1.1"
   id="svg3"
   sodipodi:docname="simple-gradient-rotated-bigger.svg"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview3"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.9375"
     inkscape:cx="132.93617"
     inkscape:cy="139.74468"
     inkscape:window-width="2560"
     inkscape:window-height="1377"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg3" />
  <defs
     id="defs2">
    <pattern
       inkscape:collect="always"
       xlink:href="#patternPlain"
       id="pattern3"
       patternTransform="rotate(18.820341,-18.520824,-17.945863)" />
    <!-- Plain gradient (no href) -->
    <linearGradient
       id="plainGrad"
       x1="0"
       y1="0"
       x2="1"
       y2="1"
       gradientTransform="rotate(45)">
      <stop
         offset="0"
         stop-color="blue"
         id="stop1" />
      <stop
         offset="1"
         stop-color="green"
         id="stop2" />
    </linearGradient>
    <!-- Pattern using the plain gradient -->
    <pattern
       id="patternPlain"
       patternUnits="userSpaceOnUse"
       x="0"
       y="0"
       width="40"
       height="40">
      <rect
         width="40"
         height="40"
         fill="url(#plainGrad)"
         id="rect2" />
    </pattern>
  </defs>
  <!-- Rectangle filled with the pattern -->
  <rect
     x="-26.864943"
     y="36.546295"
     width="180"
     height="180"
     fill="url(#patternPlain)"
     id="rect3"
     style="fill:url(#pattern3)"
     transform="rotate(-18.484989)" />
</svg>
