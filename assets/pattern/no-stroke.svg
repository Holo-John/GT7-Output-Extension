<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">

  <defs>
    <pattern id="loudpattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <!-- background -->
      <rect width="20" height="20" fill="#ffcc00"/>

      <!-- bold diagonals -->
      <path d="M0 20 L20 0" stroke="#ff0000" stroke-width="4"/>
      <path d="M-5 20 L20 -5" stroke="#0066ff" stroke-width="4"/>
      <path d="M0 25 L25 0" stroke="#00cc44" stroke-width="4"/>

      <!-- center dot -->
      <circle cx="10" cy="10" r="5" fill="#000"/>
    </pattern>
  </defs>

  <!-- PATTERN FILL ONLY — NO STROKE -->
  <!-- After your pipeline sets fill='none', this element should be removed -->
  <rect x="20" y="20" width="200" height="200"
        fill="url(#loudpattern)"
        paint-order="fill stroke"/>
</svg>
