<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="200" height="200"
     viewBox="0 0 200 200">

  <defs>
    <pattern id="complexPattern"
             patternUnits="userSpaceOnUse"
             width="40" height="40"
             x="0" y="0">

      <!-- Background -->
      <rect x="0" y="0" width="40" height="40" fill="#ffffff"/>

      <!-- Diagonal stripes -->
      <polygon points="0,0 20,0 40,20 40,40" fill="#ff0000"/>
      <polygon points="0,20 20,40 0,40" fill="#00ff00"/>
      <polygon points="20,0 40,0 40,20" fill="#0000ff"/>
      <polygon points="0,0 0,20 20,0" fill="#ffa500"/>

      <!-- Center circle -->
      <circle cx="20" cy="20" r="6" fill="#800080"/>
    </pattern>
  </defs>

  <!-- Shape using the pattern -->
  <rect id="patternRect"
        x="20" y="20"
        width="160" height="160"
        fill="url(#complexPattern)"
        stroke="#000000" stroke-width="2"/>
</svg>
