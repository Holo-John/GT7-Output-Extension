<svg xmlns="http://www.w3.org/2000/svg"
     width="300" height="300">

  <defs>
    <!-- Gradient inside the pattern -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="red"/>
      <stop offset="1" stop-color="blue"/>
    </linearGradient>

    <!-- Pattern WITH a viewBox -->
    <pattern id="p"
             patternUnits="userSpaceOnUse"
             x="0" y="0"
             width="60" height="60"
             viewBox="0 0 100 50"
             preserveAspectRatio="xMidYMid"
             patternTransform="rotate(20)">
      
      <!-- Content drawn in VIEWBOX space (100×50) -->
      <rect x="0" y="0" width="100" height="50"
            fill="url(#g)"/>
      
      <!-- A diagnostic circle to show scaling -->
      <circle cx="50" cy="25" r="10" fill="yellow"/>
    </pattern>
  </defs>

  <!-- Rectangle filled with the pattern -->
  <rect x="20" y="20" width="260" height="260"
        fill="url(#p)" stroke="black"/>
</svg>
