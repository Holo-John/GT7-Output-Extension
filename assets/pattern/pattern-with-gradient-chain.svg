<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="gradBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="blue"/>
      <stop offset="1" stop-color="green"/>
    </linearGradient>

    <!-- Gradient referencing gradBase -->
    <linearGradient id="gradChain" href="#gradBase"
                    gradientTransform="rotate(45)">
      <!-- No stops → inherits from gradBase -->
    </linearGradient>

    <!-- Pattern using gradient chain -->
    <pattern id="gradientPattern" patternUnits="userSpaceOnUse"
             x="0" y="0" width="40" height="40">
      <rect width="40" height="40" fill="url(#gradChain)"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="180" height="180"
        fill="url(#gradientPattern)"/>
</svg>
