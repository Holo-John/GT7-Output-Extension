<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="500"
    height="220"
    viewBox="0 0 500 220">

  <defs>

    <!-- Pattern content uses objectBoundingBox coordinates -->
    <pattern
		id="bboxPattern"
		patternContentUnits="objectBoundingBox"
		width="0.25"
		height="0.25"
		viewBox="-50 -50 100 100">

	  <path
		  d="M -50 -50 L 50 50"
		  stroke="magenta"
		  stroke-width="5"/>

	  <path
		  d="M 50 -50 L -50 50"
		  stroke="cyan"
		  stroke-width="5"/>

	</pattern>



  </defs>

  <!-- Large rectangle using same pattern -->
  <rect
      x="180"
      y="20"
      width="250"
      height="100"
      fill="url(#bboxPattern)"
      stroke="black"/>

</svg>