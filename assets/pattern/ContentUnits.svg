<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="500"
    height="220"
    viewBox="0 0 500 220">

  <defs>

    <!-- Pattern content uses objectBoundingBox coordinates -->
    <pattern
        id="bboxPattern"
        patternUnits="objectBoundingBox"
        patternContentUnits="objectBoundingBox"
        width="0.25"
        height="0.25">

      <!-- Diagonal cross -->
      <path
          d="M 0 0 L 1 1"
          stroke="red"
          stroke-width="0.05"/>

      <path
          d="M 1 0 L 0 1"
          stroke="blue"
          stroke-width="0.05"/>

    </pattern>

  </defs>

  <!-- Small reference rectangle -->
  <rect
      x="20"
      y="20"
      width="100"
      height="100"
      fill="url(#bboxPattern)"
      stroke="black"/>

  <!-- Large rectangle using same pattern -->
  <rect
      x="180"
      y="20"
      width="250"
      height="150"
      fill="url(#bboxPattern)"
      stroke="black"/>


</svg>