<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="400"
    height="150"
    viewBox="0 0 400 150">

  <defs>

    <!-- Fully implicit radial gradient -->
    <radialGradient id="rg-defaults">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#800080"/>
    </radialGradient>

  </defs>

  <!-- Square -->
  <rect
      x="20"
      y="20"
      width="100"
      height="100"
      fill="url(#rg-defaults)"
      stroke="black"/>

  <!-- Wide rectangle -->
  <rect
      x="150"
      y="20"
      width="200"
      height="100"
      fill="url(#rg-defaults)"
      stroke="black"/>

</svg>