<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120">
  <defs>
    <mask id="circleMask">
      <rect x="0" y="0" width="200" height="120" fill="white"/>
      <circle cx="100" cy="60" r="40" fill="black"/>
    </mask>
  </defs>

  <rect id="rectWithMask"
        x="20" y="20" width="160" height="80"
        fill="blue"
        mask="url(#circleMask)" />
</svg>
