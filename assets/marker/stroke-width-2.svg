<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="m" markerUnits="strokeWidth"
            markerWidth="10" markerHeight="10"
            refX="0" refY="2" orient="auto">
      <!-- No stroke-width → must inherit parent stroke-width -->
      <path d="M0,0 L4,2 L0,4 Z" fill="red" stroke="black"/>
    </marker>
  </defs>

  <!-- Parent element with transform scale(3) -->
  <g transform="scale(3)">
    <path d="M20 20 L100 20"
          stroke="black"
          stroke-width="4"
          marker-end="url(#m)"/>
  </g>

</svg>
