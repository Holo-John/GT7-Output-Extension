<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="200"
   height="200"
   viewBox="0 0 200 200"
   version="1.1"
   id="svg1"
   sodipodi:docname="simple-marker.svg"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.0771262"
     inkscape:cx="22.868134"
     inkscape:cy="94.60186"
     inkscape:window-width="933"
     inkscape:window-height="1211"
     inkscape:window-x="310"
     inkscape:window-y="76"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg1" />
  <!-- Marker definitions -->
  <defs
     id="defs1">
    <!-- Simple arrowhead marker -->
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="10"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="red"
         id="path1" />
    </marker>
    <!-- Circle marker for midpoints -->
    <marker
       id="dot"
       viewBox="0 0 10 10"
       refX="5"
       refY="5"
       markerWidth="4"
       markerHeight="4"
       orient="auto"
       markerUnits="strokeWidth">
      <circle
         cx="5"
         cy="5"
         r="3"
         fill="blue"
         id="circle1" />
    </marker>
  </defs>
  <!-- Test path with transform and all three markers -->
  <path
     id="test-path"
     d="M 20 20 L 80 20 L 120 60 L 160 20"
     fill="none"
     stroke="black"
     stroke-width="1.5"
     transform="translate(20,40) rotate(15)"
     marker-start="url(#arrow)"
     marker-mid="url(#dot)"
     marker-end="url(#arrow)" />
</svg>
