<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="200"
    height="200"
    viewBox="0 0 200 200">

  <!-- Marker definitions -->
  <defs>
    <!-- Simple arrowhead marker -->
    <marker
        id="arrow"
        viewBox="0 0 10 10"
        refX="10"
        refY="5"
        markerWidth="6"
        markerHeight="6"
        orient="auto"
        markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="red"/>
    </marker>

    <!-- Circle marker for midpoints -->
    <marker
        id="dot"
        viewBox="0 0 10 10"
        refX="5"
        refY="5"
        markerWidth="4"
        markerHeight="4"
        orient="auto"
        markerUnits="strokeWidth">
      <circle cx="5" cy="5" r="3" fill="blue"/>
    </marker>
  </defs>

  <!-- Test path with transform and all three markers -->
  <path
      id="test-path"
      d="M 20 20 L 80 20 L 120 60 L 160 20"
      fill="none"
      stroke="black"
      stroke-width="4"
      transform="translate(20,40) rotate(15)"
      marker-start="url(#arrow)"
      marker-mid="url(#dot)"
      marker-end="url(#arrow)"/>
</svg>
